# Evaluation question set for the German Bureaucracy Navigator — DEFAULT short set (23 questions).
#
# The complete 31-question set is kept in questions_full.yaml (run the scripts with --questions data/eval/questions_full.yaml).
# IDs are identical in both files so runs on the two sets are comparable; the 8 questions omitted here are
# Q09, Q10, Q14, Q15, Q17, Q21, Q23 and Q29.
#
# Groups (reporting buckets — they do not restrict what the agent may do)
#   knowledge    the answer needs only the knowledge base (search_knowledge_base)
#   mixed        the answer needs the knowledge base AND at least one calculator / live-API tool
#   tool_only    the answer is a pure calculation; a knowledge-base search is optional
#   not_covered  on-topic, but the knowledge base has no answering passage → the app must say so
#
# Fields
#   id               stable identifier, used in reports
#   question         exactly what the user types (English or German)
#   language         en | de   (informational; the app auto-detects)
#   covered          true = the knowledge base contains a passage that ANSWERS the question
#   coverage_check   whether the question counts towards the coverage metrics. When true, a knowledge-base
#                    search is REQUIRED (a missing search counts as a tool-selection failure) and its
#                    coverage must be "ok" (covered: true) or "weak"/"none" (covered: false).
#   expected_docs    files in data/processed/ — retrieval is a "hit" if ANY of them appears in the top-k
#   expected_section the section(s) that answer it (informational, for the reviewer)
#   expected_tools   tools that MUST be called in the end-to-end run
#   forbidden_tools  tools that must NOT be called
#   expected_args    argument values that must appear in (at least one call of) the tool — subset match;
#                    numbers compared numerically, strings case-insensitively, "any" = present, any value
#   expected_facts   what a correct answer contains / must not contain — for the reviewer; NOT scored
#   probe            faithfulness = a question where an unsourced model is likely to add facts the passages
#                    do not contain (recent rule changes, partial coverage, tempting details). Every answer
#                    is scored for faithfulness; these are reported as a subgroup.
#   difficulty       normal | hard  (partially covered topics; reported separately)
#   notes            why the question is in the set

questions:

# ───────────────────────────── knowledge only (2) ─────────────────────────────

- id: Q01
  question: "I am a non-EU master's student working as a Werkstudent for €1,400 a month during the semester break. How many days per year may I work, do HiWi jobs count, and will I pay income tax on this?"
  language: en
  group: knowledge
  covered: true
  coverage_check: true
  expected_docs: [students_working.md]
  expected_section: "1. Immigration: how much a non-EU student may work / 4. Taxes"
  expected_tools: [search_knowledge_base]
  forbidden_tools: [estimate_net_salary, check_blue_card_salary]
  expected_facts: ["140 full or 280 half days per calendar year (§ 16b Abs. 3 AufenthG, raised from 120/240 in March 2024)", "HiWi jobs and compulsory internships do not count", "basic allowance EUR 12,348 → little or no income tax over the year, refund via tax return"]
  probe: faithfulness
  notes: the 120→140 change is recent; an unsourced answer says 120. The net-salary calculator applies employee social contributions and is WRONG for a Werkstudent, so it is forbidden despite the salary figure

- id: Q02
  question: "How long is a Verpflichtungserklärung valid, and for how long is the person who signed it liable for me?"
  language: en
  group: knowledge
  covered: true
  coverage_check: true
  expected_docs: [students_blocked_account.md]
  expected_section: "The formal obligation letter (Verpflichtungserklärung) in detail"
  expected_tools: [search_knowledge_base]
  forbidden_tools: [calculate_deadline]
  expected_facts: ["no more than six months between signing and visa issue", "liability limited to five years from entry (§ 68 AufenthG)", "ends earlier when the purpose of stay changes with a new title", "fee EUR 29"]
  probe: faithfulness
  notes: the question that produced the "valid for one year" hallucination; now answerable from the KB

